packaging_format = 2

id = "freenet"
name = "Freenet node"
description.en = "Volunteer peer for the Freenet network (dashboard on an SSO-gated panel)"

version = "0.2.142~ynh1"

maintainers = []

[upstream]
license = "GPL-2.0-or-later"
website = "https://freenet.org"
code = "https://github.com/freenet/freenet-core"
admindoc = "https://freenet.org/quickstart/docker/"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
# Official image is published for linux/amd64 and linux/arm64 only.
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "5G"
ram.build = "10M"
ram.runtime = "500M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.peer_port]
    ask.en = "External peer port (UDP) to forward on your router"
    help.en = "Freenet peers reach you over this UDP port (default 31337). Forward it on your router to this server, or connectivity stays limited. Skip forwarding if you only want a relay behind NAT — the node still works, just less well."
    type = "number"
    default = 31337

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
        main.url = "/"
        # The node dashboard must not receive SSO basic-auth creds;
        # ssowat still gates the URL itself.
        main.auth_header = false

    [resources.ports]
    # Dashboard/local API port — always loopback-bound by the node itself,
    # never exposed. The UDP peer port is opened via 'yunohost firewall allow'
    # in the scripts (single fixed port, host networking, no bridge mapping).
    main.default = 7509
    main.exposure = "none"
