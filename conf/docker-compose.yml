services:
  freenet:
    image: ghcr.io/freenet/freenet-core:latest
    container_name: __APP__
    # Host networking is REQUIRED (not optional): the local API/dashboard binds
    # to loopback, which under bridge networking is the container's loopback and
    # nothing on the host (incl. the SSO nginx proxy) could reach it. It also
    # avoids source-port rewriting that breaks UDP hole punching, and sidesteps
    # YunoHost firewall reloads wiping Docker's bridge iptables chains.
    network_mode: host
    environment:
      # Pinned transport port (documented; without it the node binds a random
      # port and no firewall/router rule could reliably match).
      - NETWORK_PORT=__PEER_PORT__
      # Dashboard/local API port — stays loopback-bound; nginx+SSO proxy it.
      - WS_API_PORT=__PORT__
      # Accept the public hostname in the API's Host-header check so the
      # reverse proxy works. Loopback hosts are accepted by default.
      - FREENET_ALLOWED_HOST=__DOMAIN__
    volumes:
      # Node identity + data. Losing this = losing node identity/history.
      - freenet-data:/data
    restart: unless-stopped
    # Graceful shutdown lets the node finish peer bookkeeping (official docs).
    stop_grace_period: 45s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  freenet-data:
    name: __APP__-data
