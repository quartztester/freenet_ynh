#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/tests.v1.schema.json

test_format = 1.0

[default]
    # Freenet dashboard is root-only (absolute URLs); install refuses
    # sub-paths, so the subdir scenario cannot run.
    exclude = ["install.subdir"]

    # Upgrade tests: last commit of each previous package version.
    test_upgrade_from.c921548.name = "0.2.142~ynh4"
    test_upgrade_from.771426f.name = "0.2.152~ynh1"
    test_upgrade_from.15dd183.name = "0.2.142~ynh2"
